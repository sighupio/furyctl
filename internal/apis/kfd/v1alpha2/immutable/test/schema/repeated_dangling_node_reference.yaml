# ghost01 is referenced twice and defined nowhere: the dangling-reference message
# must name it once, and the multiple-references message reports the repetition.
spec:
  infrastructure:
    nodes:
      - hostname: ctrl01
  kubernetes:
    controlPlane:
      members:
        - hostname: ctrl01
    etcd:
      members:
        - hostname: ghost01
    nodeGroups:
      - name: workers
        nodes:
          - hostname: ghost01
