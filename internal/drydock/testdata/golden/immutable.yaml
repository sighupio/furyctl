# yaml-language-server: $schema=https://raw.githubusercontent.com/sighupio/distribution/v1.35.1/schemas/public/immutable-kfd-v1alpha2.json
# Generated by `furyctl drydock`. Review it, export the referenced environment variables,
# prepare the referenced files, then run `furyctl validate config` and `furyctl apply`.
# Reference: https://docs.sighup.io/docs/installation/sd-configuration/providers/Immutable
---
apiVersion: kfd.sighup.io/v1alpha2
kind: Immutable
metadata:
  name: "production"
spec:
  distributionVersion: v1.35.1

  infrastructure:
    # SSH access to the nodes after the first boot.
    ssh:
      username: "core"
      privateKeyPath: "{env://SSH_PRIVATE_KEY_PATH}"

    # furyctl serves the boot assets from this URL during `furyctl apply`.
    ipxeServer:
      url: "https://ipxe.example.com:8080"

    # One entry per machine. Roles are assigned below in kubernetes.controlPlane, etcd,
    # nodeGroups and infrastructure.loadBalancers by hostname.
    nodes:
      - hostname: "lb1.k8s.example.com"
        macAddress: "52:54:00:00:00:01"
        storage:
          installDisk: "/dev/sda"
        network:
          ethernets:
            "eth0":
              addresses:
                - "192.168.1.200/24"
              gateway: "192.168.1.1"
              nameservers:
                addresses:
                  - "8.8.8.8"
                  - "8.8.4.4"
                search:
                  - "k8s.example.com"
      - hostname: "lb2.k8s.example.com"
        macAddress: "52:54:00:00:00:02"
        storage:
          installDisk: "/dev/sda"
        network:
          ethernets:
            "eth0":
              addresses:
                - "192.168.1.202/24"
              gateway: "192.168.1.1"
              nameservers:
                addresses:
                  - "8.8.8.8"
                  - "8.8.4.4"
                search:
                  - "k8s.example.com"
      - hostname: "cp1.k8s.example.com"
        macAddress: "{env://CP1_MAC}"
        storage:
          installDisk: "/dev/sda"
        network:
          ethernets:
            "eth0":
              addresses:
                - "192.168.1.10/24"
              gateway: "192.168.1.1"
              nameservers:
                addresses:
                  - "8.8.8.8"
                  - "8.8.4.4"
                search:
                  - "k8s.example.com"
      - hostname: "cp2.k8s.example.com"
        macAddress: "52:54:00:01:00:02"
        storage:
          installDisk: "/dev/sda"
        network:
          ethernets:
            "eth0":
              addresses:
                - "192.168.1.11/24"
              gateway: "192.168.1.1"
              nameservers:
                addresses:
                  - "8.8.8.8"
                  - "8.8.4.4"
                search:
                  - "k8s.example.com"
      - hostname: "cp3.k8s.example.com"
        macAddress: "52:54:00:01:00:03"
        storage:
          installDisk: "/dev/sda"
        network:
          ethernets:
            "eth0":
              addresses:
                - "192.168.1.12/24"
              gateway: "192.168.1.1"
              nameservers:
                addresses:
                  - "8.8.8.8"
                  - "8.8.4.4"
                search:
                  - "k8s.example.com"
      - hostname: "infra1.k8s.example.com"
        macAddress: "52:54:00:02:00:01"
        storage:
          installDisk: "/dev/sda"
          disks:
            - device: "/dev/sdb"
              wipe_table: true
              partitions:
                - label: "data"
                  number: 1
                  should_exist: true
                  resize: false
          filesystems:
            - device: "/dev/disk/by-partlabel/data"
              format: xfs
              path: "/var/lib/longhorn"
              label: "data"
              wipe_filesystem: false
              with_mount_unit: true
          directories:
            - path: "/var/lib/longhorn"
              mode: 493
              overwrite: false
          files:
            - path: "/etc/motd"
              mode: 420
              overwrite: true
              contents:
                inline: |-
                  managed by furyctl
        network:
          ethernets:
            "eth0":
              addresses:
                - "192.168.1.100/24"
              gateway: "192.168.1.1"
              nameservers:
                addresses:
                  - "8.8.8.8"
                  - "8.8.4.4"
                search:
                  - "k8s.example.com"
        systemd:
          units:
            - name: "iscsid.service"
              enabled: true
        passwd:
          users:
            - name: "ops"
              ssh_authorized_keys:
                - "ssh-ed25519 AAAA ops@example.com"
              groups:
                - "sudo"
              shell: "/bin/bash"
              password_hash: "{env://OPS_PASSWORD_HASH}"
        kernelArguments:
          shouldExist:
            - "console=ttyS0"
        kernelParameters:
          - name: "vm.max_map_count"
            value: "262144"
      - hostname: "infra2.k8s.example.com"
        macAddress: "52:54:00:02:00:02"
        storage:
          installDisk: "/dev/sda"
        network:
          ethernets:
            "eth0":
              addresses:
                - "192.168.1.101/24"
              gateway: "192.168.1.1"
              nameservers:
                addresses:
                  - "8.8.8.8"
                  - "8.8.4.4"
                search:
                  - "k8s.example.com"
      - hostname: "infra3.k8s.example.com"
        macAddress: "52:54:00:02:00:03"
        storage:
          installDisk: "/dev/sda"
        network:
          ethernets:
            "eth0":
              addresses:
                - "192.168.1.102/24"
              gateway: "192.168.1.1"
              nameservers:
                addresses:
                  - "8.8.8.8"
                  - "8.8.4.4"
                search:
                  - "k8s.example.com"
      - hostname: "workers1.k8s.example.com"
        macAddress: "52:54:00:03:00:01"
        storage:
          installDisk: "/dev/sda"
        network:
          ethernets:
            "eth0":
              addresses:
                - "192.168.1.110/24"
              gateway: "192.168.1.1"
              nameservers:
                addresses:
                  - "8.8.8.8"
                  - "8.8.4.4"
                search:
                  - "k8s.example.com"
      - hostname: "workers2.k8s.example.com"
        macAddress: "52:54:00:03:00:02"
        storage:
          installDisk: "/dev/nvme0n1"
        network:
          ethernets:
            "eth0":
              dhcp4: true
      - hostname: "gpu1.k8s.example.com"
        macAddress: "52:54:00:04:00:01"
        arch: arm64
        storage:
          installDisk: "/dev/sda"
        network:
          ethernets:
            "eth0":
              addresses:
                - "192.168.1.120/24"
              gateway: "192.168.1.1"
              nameservers:
                addresses:
                  - "8.8.8.8"
                  - "8.8.4.4"
                search:
                  - "k8s.example.com"
              routes:
                - to: "10.10.0.0/16"
                  via: "192.168.1.254"

    # HAProxy in front of the API server, with a keepalived floating IP.
    loadBalancers:
      members:
        - hostname: "lb1.k8s.example.com"
        - hostname: "lb2.k8s.example.com"
      keepalived:
        enabled: true
        interface: "eth0"
        ip: "192.168.1.201"
        virtualRouterId: "1"

  kubernetes:
    # Generate the CA files here with `furyctl create pki` before `furyctl apply`.
    pkiPath: "./pki"
    networking:
      podCIDR: "10.244.0.0/16"
      serviceCIDR: "10.96.0.0/12"
    controlPlane:
      # Must resolve to the load balancer, the floating IP, or the first control plane node.
      address: "api.k8s.example.com:6443"
      members:
        - hostname: "cp1.k8s.example.com"
        - hostname: "cp2.k8s.example.com"
        - hostname: "cp3.k8s.example.com"
    nodeGroups:
      - name: infra
        labels:
          node-role.kubernetes.io/infra: ""
        taints:
          - key: node-role.kubernetes.io/infra
            value: ""
            effect: NoSchedule
        nodes:
          - hostname: "infra1.k8s.example.com"
          - hostname: "infra2.k8s.example.com"
          - hostname: "infra3.k8s.example.com"
      - name: workers
        nodes:
          - hostname: "workers1.k8s.example.com"
          - hostname: "workers2.k8s.example.com"
      - name: "gpu"
        labels:
          "accelerator": "nvidia"
        taints:
          - key: "nvidia.com/gpu"
            value: "true"
            effect: NoSchedule
        nodes:
          - hostname: "gpu1.k8s.example.com"
    advanced:
      kubeProxy:
        type: none
      encryption:
        configuration: "{file://./secrets/etcd-encryption-config.yaml}"
      oidc:
        issuer_url: "https://login.example.com/realms/main"
        client_id: "kubernetes"
        username_claim: "email"
        groups_claim: "groups"
      apiServer:
        certSANs:
          - "api.k8s.example.com"
      kubeletConfiguration:
        maxPods: 200

  distribution:
    common:
      # The distribution's own workloads run on the infra nodes.
      nodeSelector:
        node-role.kubernetes.io/infra: ""
      tolerations:
        - key: node-role.kubernetes.io/infra
          operator: Exists
          effect: NoSchedule
    modules:
      networking:
        type: cilium

      ingress:
        baseDomain: "internal.example.com"
        haproxy:
          type: dual
          tls:
            provider: certManager
        certManager:
          clusterIssuer:
            name: "letsencrypt"
            email: "platform@example.com"
            type: http01

      logging:
        type: loki
        loki:
          backend: externalEndpoint
          externalEndpoint:
            endpoint: "s3.example.com"
            bucketName: "loki"
            accessKeyId: "{env://LOKI_ACCESS_KEY_ID}"
            secretAccessKey: "{env://LOKI_SECRET_ACCESS_KEY}"
            insecure: false
          retentionTime: "720h"

      monitoring:
        type: prometheus
        prometheus:
          retentionTime: "30d"
          retentionSize: "120GB"
          storageSize: "150Gi"
        alertmanager:
          slackWebhookUrl: "{env://ALERTMANAGER_SLACK_WEBHOOK}"

      tracing:
        type: none

      policy:
        type: kyverno
        kyverno:
          validationFailureAction: Enforce
          installDefaultPolicies: true

      dr:
        type: on-premises
        velero:
          backend: minio
        etcdBackup:
          type: s3
          s3:
            schedule: "0 2 * * *"
            retentionTime: "720h"
            endpoint: "s3.example.com"
            bucketName: "etcd-backup"
            accessKeyId: "{env://ETCD_S3_ACCESS_KEY_ID}"
            secretAccessKey: "{env://ETCD_S3_SECRET_ACCESS_KEY}"

      auth:
        provider:
          type: basicAuth
          basicAuth:
            username: "admin"
            password: "{env://AUTH_BASIC_PASSWORD}"
