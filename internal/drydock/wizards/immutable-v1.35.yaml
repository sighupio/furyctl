# Immutable provider wizard for SIGHUP Distribution v1.35.x.
# Questions only: the mapping to furyctl.yaml lives in immutable-v1.35.yaml.tpl.
kind: Immutable
versions: ">= 1.35.1, < 1.36.0"
defaultVersion: v1.35.1
template: immutable-v1.35.yaml.tpl
steps:
  - id: cluster
    title: Cluster
    description: Identity of the cluster and how furyctl reaches the machines.
    fields:
      - id: nodeKind
        type: choice
        label: What are the nodes
        help: "Bare metal turns on the settings the SIGHUP Distribution documentation prescribes for physical machines: the inotify limits, the pod density of the kubelet, the pod subnet per node and the dedicated data disks. On virtual machines the distribution defaults are left alone."
        options: [bare-metal, virtual-machines]
        default: bare-metal
      - id: name
        type: text
        example: "production"
        label: Cluster name
        help: Lowercase letters, digits and dashes. Used as metadata.name.
        required: true
        placeholder: production
      - id: domain
        type: text
        example: "k8s.example.com"
        label: Node domain
        help: Node hostnames are generated as <role><n>.<domain>. You can edit each one later.
        required: true
        default: k8s.example.com
      - id: sshUser
        type: text
        example: "core"
        label: SSH user
        default: core
        required: true
      - id: sshPrivateKey
        type: path
        example: "~/.ssh/id_ed25519"
        label: SSH private key
        help: furyctl uses this key to reach the nodes after the first boot.
        default: ~/.ssh/id_ed25519
        suggest: env
      - id: sshPublicKey
        type: path
        example: "~/.ssh/id_ed25519.pub"
        label: SSH public key
        help: Leave empty to use the private key path with a .pub extension.
      - id: ipxeUrl
        type: text
        example: "https://ipxe.example.com:8080"
        label: iPXE server URL
        help: furyctl serves the boot assets itself. This is the URL the nodes will reach, pointing at the machine where furyctl runs.
        required: true
        placeholder: https://ipxe.example.com:8080
      - id: ipxeBindAddress
        type: text
        example: "0.0.0.0"
        label: iPXE bind address
        help: Leave empty for the default.
      - id: ipxeBindPort
        type: number
        example: "8080"
        label: iPXE bind port
        min: 1
        max: 65535
      - id: pkiPath
        type: path
        example: "./pki"
        label: PKI directory
        help: Run `furyctl create pki` to generate the CA files here before `furyctl apply`.
        default: ./pki
        required: true
      - id: proxy
        type: group
        label: HTTP proxy
        help: Only if the nodes reach the internet through a proxy.
        collapsed: true
        fields:
          - id: http
            type: text
            example: "http://proxy.example.com:3128"
            label: HTTP proxy
            placeholder: http://proxy.example.com:3128
          - id: https
            type: text
            example: "http://proxy.example.com:3128"
            label: HTTPS proxy
            placeholder: http://proxy.example.com:3128
          - id: noProxy
            type: text
            example: "localhost,127.0.0.1,10.0.0.0/8,.example.com"
            label: No proxy
            help: Comma-separated hosts and CIDRs that bypass the proxy.
            placeholder: localhost,127.0.0.1,10.0.0.0/8

  - id: topology
    title: Topology
    description: Roles and counts. The wizard generates the node list from these.
    fields:
      - id: cpCount
        type: choice
        label: Control plane nodes
        help: Three for high availability, one for a lab. The documented minimum is 2 cores, 8GB of RAM and 50GB of disk each.
        options: [1, 3]
        default: 3
      - id: dedicatedEtcd
        type: bool
        label: Dedicated etcd nodes
        help: When off, etcd runs on the control plane nodes. When on, three etcd nodes are added.
        default: false
      - id: lbMode
        type: choice
        label: Load balancer for the API server
        help: "dedicated: one or two HAProxy nodes in front of the control plane. keepalived-on-cp: a floating IP directly on the control plane nodes. none: clients reach the first control plane node."
        options: [dedicated, keepalived-on-cp, none]
        default: dedicated
      - id: lbCount
        type: choice
        label: Load balancer nodes
        help: Two nodes share a floating IP with keepalived. The documented minimum is 2 cores, 2GB of RAM and 50GB of disk each.
        options: [1, 2]
        default: 2
        when: lbMode == dedicated
      - id: vip
        type: text
        example: "192.168.1.201"
        label: Floating IP
        help: The keepalived virtual IP. Point the control plane address at it.
        required: true
        placeholder: 192.168.1.201
        when: lbMode == keepalived-on-cp || lbMode == dedicated && lbCount == 2
      - id: vipInterface
        type: text
        example: "eth0"
        label: Floating IP interface
        default: eth0
        when: lbMode == keepalived-on-cp || lbMode == dedicated && lbCount == 2
      - id: virtualRouterId
        type: number
        example: "1"
        label: Virtual router ID
        help: Unique among keepalived clusters on the same network, 1 to 255.
        default: 1
        min: 1
        max: 255
        when: lbMode == keepalived-on-cp || lbMode == dedicated && lbCount == 2
      - id: controlPlaneAddress
        type: text
        example: "api.k8s.example.com:6443"
        label: Control plane address
        help: Host and port clients use for the API server. Leave empty for api.<domain>:6443. Make it resolve to the floating IP, the load balancer, or the first control plane node.
        placeholder: api.<domain>:6443
      - id: schedulableControlPlane
        type: bool
        label: Run workloads on the control plane nodes
        help: "For a hyperconverged cluster with no dedicated workers: it empties the control plane taints, so ordinary pods are scheduled there. Leave it off when the cluster has worker nodes."
        default: false
      - id: infraCount
        type: number
        example: "3"
        label: Infrastructure worker nodes
        help: Run the distribution's own components (ingress, logging, monitoring). Labelled and tainted node-role.kubernetes.io/infra; the distribution is pinned to them. The documented minimum is 4 cores, 16GB of RAM and 50GB of disk each, and the observability stack asks for about 540GB of storage in total. Zero to skip.
        default: 3
        min: 0
      - id: workersCount
        type: number
        example: "3"
        label: Application worker nodes
        default: 3
        min: 0
      - id: extraGroups
        type: list
        label: Additional node groups
        help: Other worker pools with their own labels and taints.
        fields:
          - id: name
            type: text
            example: "gpu"
            label: Group name
            required: true
            placeholder: gpu
          - id: count
            type: number
            example: "2"
            label: Nodes
            default: 1
            min: 1
          - id: labels
            type: list
            label: Labels
            fields:
              - id: key
                type: text
                example: "accelerator"
                label: Key
                required: true
              - id: value
                type: text
                example: "nvidia"
                label: Value
          - id: taints
            type: list
            label: Taints
            fields:
              - id: key
                type: text
                example: "nvidia.com/gpu"
                label: Key
                required: true
              - id: value
                type: text
                example: "true"
                label: Value
                required: true
              - id: effect
                type: choice
                label: Effect
                options: [NoSchedule, PreferNoSchedule, NoExecute]
                default: NoSchedule

  - id: nodeDefaults
    title: Shared configuration
    description: What every node has in common. In the next step you can override any of it per role or per node.
    fields:
      - id: arch
        type: choice
        label: CPU architecture
        options: [x86-64, arm64]
        default: x86-64
      - id: installDisk
        type: text
        example: "/dev/sda"
        label: Install disk
        help: "The device Flatcar is installed on, and it is wiped. A plain device name: the schema does not accept the /dev/disk/by-id form here, unlike the data disks below."
        default: /dev/sda
        required: true
      - id: interface
        type: text
        example: "eth0"
        label: Network interface
        default: eth0
        required: true
      - id: networkMode
        type: choice
        label: Addressing
        options: [static, dhcp]
        default: static
      - id: prefixLength
        type: number
        example: "24"
        label: Prefix length
        default: 24
        min: 1
        max: 32
        when: networkMode == static
      - id: gateway
        type: text
        example: "192.168.1.1"
        label: Gateway
        required: true
        placeholder: 192.168.1.1
        when: networkMode == static
      - id: nameservers
        type: list
        example: "8.8.8.8"
        label: DNS servers
        default: ["8.8.8.8", "8.8.4.4"]
        item:
          type: text
        when: networkMode == static
      - id: searchDomains
        type: list
        example: "k8s.example.com"
        label: DNS search domains
        item:
          type: text
        when: networkMode == static
      - id: routes
        type: list
        label: Static routes
        fields:
          - id: to
            type: text
            example: "10.10.0.0/16"
            label: Destination
            required: true
            placeholder: 10.10.0.0/16
          - id: via
            type: text
            example: "192.168.1.254"
            label: Via
            required: true
            placeholder: 192.168.1.254
      - id: advanced
        type: group
        label: Advanced node configuration
        help: Extra disks, filesystems, files, systemd units, users and kernel settings. Everything here is written to every node unless overridden.
        collapsed: true
        fields:
          - id: dataDisk
            type: dataDisk
            when: cluster.nodeKind == bare-metal
            label: Add a data disk
            help: "Answer three questions and the disk, its partition and the filesystem that mounts it are written below, consistent with each other. The raw lists stay editable."
            config:
              scopeStep: nodeDefaults
              group: advanced
              disks: disks
              filesystems: filesystems
          - id: disks
            type: list
            label: Extra disks to partition
            fields:
              - id: device
                type: text
                example: "/dev/sdb"
                label: Device
                required: true
                placeholder: /dev/sdb
              - id: wipeTable
                type: bool
                label: Wipe partition table
                default: true
              - id: partitions
                type: list
                label: Partitions
                fields:
                  - id: label
                    type: text
                    example: "data"
                    label: Label
                    required: true
                    placeholder: data
                  - id: number
                    type: number
                    example: "1"
                    label: Number
                    min: 1
                  - id: sizeMib
                    type: number
                    example: "0"
                    label: Size (MiB)
                    help: Zero or empty uses the rest of the disk.
                    min: 0
                  - id: startMib
                    type: number
                    example: "0"
                    label: Start (MiB)
                    min: 0
                  - id: typeGuid
                    type: text
                    example: "0FC63DAF-8483-4772-8E79-3D69D8477DE4"
                    label: Type GUID
                  - id: shouldExist
                    type: bool
                    label: Should exist
                    default: true
                  - id: resize
                    type: bool
                    label: Resize existing
                    default: false
          - id: filesystems
            type: list
            label: Filesystems
            fields:
              - id: device
                type: text
                example: "/dev/disk/by-partlabel/data"
                label: Device
                required: true
                placeholder: /dev/disk/by-partlabel/data
              - id: format
                type: choice
                label: Format
                options: [ext4, xfs, btrfs, vfat, swap, none]
                default: ext4
              - id: path
                type: text
                example: "/var/lib/longhorn"
                label: Mount point
                placeholder: /var/lib/data
              - id: label
                type: text
                example: "data"
                label: Filesystem label
              - id: wipeFilesystem
                type: bool
                label: Wipe filesystem
                default: false
              - id: withMountUnit
                type: bool
                label: Generate mount unit
                default: true
              - id: options
                type: list
                example: "-L data"
                label: mkfs options
                item:
                  type: text
              - id: mountOptions
                type: list
                example: "noatime"
                label: Mount options
                item:
                  type: text
          - id: directories
            type: list
            label: Directories
            fields:
              - id: path
                type: text
                example: "/var/lib/longhorn"
                label: Path
                required: true
              - id: mode
                type: number
                example: "493"
                label: Mode (decimal)
                help: Decimal, as Butane wants it. 0755 is 493.
                default: 493
              - id: overwrite
                type: bool
                label: Overwrite
                default: false
              - id: user
                type: text
                example: "core"
                label: Owner
              - id: group
                type: text
                example: "core"
                label: Group
          - id: files
            type: list
            label: Files
            fields:
              - id: path
                type: text
                example: "/etc/motd"
                label: Path
                required: true
              - id: mode
                type: number
                example: "420"
                label: Mode (decimal)
                default: 420
              - id: overwrite
                type: bool
                label: Overwrite
                default: true
              - id: contents
                type: text
                example: "Managed by furyctl. Changes are lost at the next apply."
                label: Contents
                multiline: true
              - id: user
                type: text
                example: "root"
                label: Owner
              - id: group
                type: text
                example: "root"
                label: Group
          - id: links
            type: list
            label: Links
            fields:
              - id: path
                type: text
                example: "/etc/localtime"
                label: Path
                required: true
              - id: target
                type: text
                example: "/usr/share/zoneinfo/Europe/Rome"
                label: Target
                required: true
              - id: hard
                type: bool
                label: Hard link
                default: false
          - id: systemdUnits
            type: list
            label: systemd units
            fields:
              - id: name
                type: text
                example: "iscsid.service"
                label: Unit name
                required: true
                placeholder: my-agent.service
              - id: enabled
                type: bool
                label: Enabled
                default: true
              - id: mask
                type: bool
                label: Masked
                default: false
              - id: contents
                type: text
                example: "[Unit]\nDescription=My agent\n[Service]\nExecStart=/opt/bin/agent\n[Install]\nWantedBy=multi-user.target"
                label: Unit file
                multiline: true
              - id: dropins
                type: list
                label: Drop-ins
                fields:
                  - id: name
                    type: text
                    example: "10-override.conf"
                    label: Name
                    required: true
                    placeholder: 10-override.conf
                  - id: contents
                    type: text
                    example: "[Service]\nEnvironment=HTTP_PROXY=http://proxy.example.com:3128"
                    label: Contents
                    multiline: true
          - id: users
            type: list
            label: Extra users
            fields:
              - id: name
                type: text
                example: "ops"
                label: Username
                required: true
              - id: sshAuthorizedKeys
                type: list
                example: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAA... ops@example.com"
                label: SSH authorized keys
                item:
                  type: text
              - id: groups
                type: list
                example: "sudo"
                label: Groups
                item:
                  type: text
              - id: shell
                type: text
                example: "/bin/bash"
                label: Shell
              - id: passwordHash
                type: text
                example: "$6$rounds=4096$saltsalt$hashhashhash"
                label: Password hash
                suggest: env
          - id: groups
            type: list
            label: Extra groups
            fields:
              - id: name
                type: text
                example: "ops"
                label: Group name
                required: true
              - id: gid
                type: number
                example: "1500"
                label: GID
          - id: kernelArgsAdd
            type: list
            example: "console=ttyS0,115200"
            label: Kernel arguments to add
            item:
              type: text
          - id: kernelArgsRemove
            type: list
            example: "quiet"
            label: Kernel arguments to remove
            item:
              type: text
          - id: knownKernelParameters
            type: preset
            when: cluster.nodeKind == bare-metal
            label: Settings documented for bare metal nodes
            help: From "Installing on bare-metal nodes" in the SIGHUP Distribution documentation. The parameters the container runtime needs (bridge-nf-call-iptables, ip_forward) are applied by the installer itself, so they are not offered here.
            target: kernelParameters
            presets:
              - label: inotify instances 8192
                help: Every container watches files through inotify. With 200 to 500 pods per node the default of 128 instances runs out and pods stop starting.
                default: true
                value: {name: fs.inotify.max_user_instances, value: "8192"}
              - label: inotify watches 524288
                help: The companion limit to the instances one. The default of 8192 watches is exhausted by a busy node.
                default: true
                value: {name: fs.inotify.max_user_watches, value: "524288"}
          - id: kernelParameters
            type: list
            label: Kernel parameters (sysctl)
            fields:
              - id: name
                type: text
                example: "vm.max_map_count"
                label: Name
                required: true
                placeholder: net.ipv4.ip_forward
              - id: value
                type: text
                example: "262144"
                label: Value
                required: true
                placeholder: "1"

  - id: nodes
    title: Nodes
    description: One row per node. Hostnames and IPs are prefilled; MAC addresses are yours to fill.
    fields:
      - id: nodes
        type: nodeTable
        config:
          clusterStep: cluster
          topologyStep: topology
          defaultsStep: nodeDefaults

  - id: kubernetes
    title: Kubernetes
    fields:
      - id: podCIDR
        type: cidr
        example: "10.244.0.0/16"
        label: Pod CIDR
        default: 10.244.0.0/16
        required: true
      - id: serviceCIDR
        type: cidr
        example: "10.96.0.0/12"
        label: Service CIDR
        default: 10.96.0.0/12
        required: true
      - id: version
        type: text
        example: "1.35.5"
        label: Kubernetes version
        help: Leave empty for the version the distribution ships.
      - id: kubeProxy
        type: choice
        label: kube-proxy
        help: "none disables kube-proxy and puts Cilium in kube-proxy replacement mode; only with the Cilium CNI."
        options: [default, nftables, none]
        default: default
      - id: encryption
        type: bool
        label: Encrypt secrets at rest in etcd
        default: false
      - id: encryptionConfig
        type: path
        example: "./secrets/etcd-encryption-config.yaml"
        label: Encryption configuration file
        help: "An EncryptionConfiguration manifest. furyctl reads the file and puts its content in the configuration, so the value stays a {file://} reference and the keys never enter the repository."
        default: "{file://./secrets/etcd-encryption-config.yaml}"
        suggest: file
        required: true
        when: encryption
      - id: oidcEnabled
        type: bool
        label: OIDC authentication on the API server
        default: false
      - id: oidc
        type: group
        label: OIDC
        when: oidcEnabled
        fields:
          - id: issuerUrl
            type: text
            example: "https://login.example.com/realms/main"
            label: Issuer URL
            required: true
            placeholder: https://login.example.com/realms/main
          - id: clientId
            type: text
            example: "kubernetes"
            label: Client ID
            required: true
          - id: usernameClaim
            type: text
            example: "email"
            label: Username claim
            default: email
          - id: groupsClaim
            type: text
            example: "groups"
            label: Groups claim
            default: groups
          - id: caFile
            type: path
            example: "./secrets/oidc-ca.crt"
            label: Issuer CA file
            suggest: file
      - id: registry
        type: text
        example: "registry.example.com/kubernetes"
        label: Private registry for Kubernetes images
        help: Leave empty to pull from the default registry.
      - id: certSANs
        type: list
        example: "api.k8s.example.com"
        label: Extra API server SANs
        item:
          type: text
      - id: maxPods
        type: number
        example: "500"
        when: cluster.nodeKind == bare-metal
        default: 500
        label: Max pods per node
        help: "The kubelet allows 110 by default. It must stay below the addresses available in the per-node pod subnet: a /24 gives about 250, a /23 about 500, a /22 about 1000."
        min: 1
      - id: systemReserved
        type: group
        when: cluster.nodeKind == bare-metal
        label: Resources reserved for the system
        help: Kept aside for the kubelet, the container runtime and the OS, so a busy node does not starve them. The documented rule of thumb is in each field.
        collapsed: true
        fields:
          - id: cpu
            type: text
            example: "2000m"
            label: CPU
            help: One core under 16 cores, two cores from 16 to 64, four cores above 64.
          - id: memory
            type: text
            example: "4Gi"
            label: Memory
            help: 1 to 2Gi under 32GB of RAM, 2 to 4Gi from 32 to 128GB, 4 to 8Gi above.
          - id: ephemeralStorage
            type: text
            example: "1Gi"
            label: Ephemeral storage
            help: 1Gi with minimal logging, 2 to 5Gi with verbose logging or a longer retention.

  - id: modules
    title: Distribution modules
    fields:
      - id: networking
        type: group
        label: Networking (CNI)
        fields:
          - id: type
            type: choice
            label: CNI
            options: [cilium, calico]
            default: cilium
          - id: nodeSubnetSize
            type: number
            example: "23"
            when: cluster.nodeKind == bare-metal
            default: 23
            label: Pod subnet size per node
            help: The prefix length the CNI carves out of the pod CIDR for each node. A /23 gives about 500 addresses, which matches 500 pods per node. Keep it consistent with the max pods per node.
            min: 8
            max: 30
      - id: ingress
        type: group
        label: Ingress
        fields:
          - id: baseDomain
            type: text
            example: "internal.example.com"
            label: Base domain for the distribution's ingresses
            required: true
            placeholder: internal.example.com
          - id: controller
            type: choice
            label: Ingress controller
            options: [haproxy, nginx, byoic]
            default: haproxy
          - id: type
            type: choice
            label: Controller layout
            help: "single: one controller. dual: one internal and one external. none: cert-manager only."
            options: [single, dual, none]
            default: single
            when: controller != byoic
          - id: byoicIngressClass
            type: text
            example: "nginx"
            label: IngressClass for infrastructure ingresses
            required: true
            when: controller == byoic
          - id: tlsProvider
            type: choice
            label: TLS for the controller
            options: [certManager, secret, none]
            default: certManager
            when: controller != byoic && type != none
          - id: tlsCert
            type: path
            example: "./secrets/ingress.crt"
            label: TLS certificate file
            suggest: file
            required: true
            when: controller != byoic && type != none && tlsProvider == secret
          - id: tlsKey
            type: path
            example: "./secrets/ingress.key"
            label: TLS key file
            suggest: file
            required: true
            when: controller != byoic && type != none && tlsProvider == secret
          - id: tlsCa
            type: path
            example: "./secrets/ingress-ca.crt"
            label: TLS CA file
            suggest: file
            required: true
            when: controller != byoic && type != none && tlsProvider == secret
          - id: issuerName
            type: text
            example: "letsencrypt"
            label: cert-manager ClusterIssuer name
            default: letsencrypt
            required: true
          - id: issuerEmail
            type: text
            example: "platform@example.com"
            label: ClusterIssuer e-mail
            required: true
            placeholder: platform@example.com
          - id: issuerType
            type: choice
            label: ClusterIssuer challenge
            help: "http01 through the ingress controller, or your own ACME solvers as YAML."
            options: [http01, custom]
            default: http01
          - id: issuerSolvers
            type: text
            example: "- dns01:\n    cloudflare:\n      apiTokenSecretRef:\n        name: cloudflare-api-token\n        key: token"
            label: ACME solvers (YAML list)
            multiline: true
            required: true
            when: issuerType == custom
      - id: logging
        type: group
        label: Logging
        fields:
          - id: type
            type: choice
            label: Stack
            options: [loki, opensearch, none]
            default: loki
          - id: lokiBackend
            type: choice
            label: Loki storage
            options: [minio, externalEndpoint]
            default: minio
            when: type == loki
          - id: lokiRetention
            type: text
            example: "720h"
            label: Log retention
            placeholder: 720h
            when: type == loki
          - id: lokiEndpoint
            type: text
            example: "s3.example.com"
            label: S3 endpoint
            required: true
            when: type == loki && lokiBackend == externalEndpoint
          - id: lokiBucket
