repositories:
  - name: podinfo
    url: https://stefanprodan.github.io/podinfo
  - name: metrics-server
    url: https://kubernetes-sigs.github.io/metrics-server

releases:
  - chart: podinfo/podinfo
    name: poc-podinfo
    namespace: poc-helm
    version: 6.7.1
  - chart: metrics-server/metrics-server
    name: poc-metrics
    namespace: poc-helm
    version: 3.12.2

helmBinary: /opt/user/run/.furyctl/bin/helm/3.22.0/helm
