# Fields of the public schemas of the distribution (schemas/public at v1.36.0, the four
# kinds), with every list item written as position 0.
#
# hidden: the fields that hold a credential, by the name of their key or by what they
# hold. A field the schema leaves free-form is written with the key that the tool it
# configures uses for a credential.
# shown: the fields whose key holds a sensitive word but whose value is not a secret.
